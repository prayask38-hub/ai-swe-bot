<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SWE Bot — by Prayas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #080810;
            --bg2: #0e0e1a;
            --bg3: #13131f;
            --bg4: #1a1a2e;
            --border: #ffffff12;
            --border2: #ffffff20;
            --text: #e8e8f0;
            --muted: #6b6b80;
            --green: #00ff88;
            --purple: #7c3aed;
            --purple2: #a855f7;
            --blue: #3b82f6;
            --red: #ef4444;
            --yellow: #f59e0b;
            --font-code: 'JetBrains Mono', monospace;
            --font-ui: 'Inter', sans-serif;
        }

        body {
            font-family: var(--font-ui);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow: hidden
        }

        /* Header */
        .header {
            height: 52px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
            position: relative;
            z-index: 10
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .logo-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            animation: glow 2s ease-in-out infinite
        }

        @keyframes glow {

            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 8px var(--green)
            }

            50% {
                opacity: .5;
                box-shadow: 0 0 4px var(--green)
            }
        }

        .logo-text {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -.01em
        }

        .logo-version {
            font-size: 10px;
            padding: 2px 8px;
            background: var(--purple);
            border-radius: 20px;
            color: #fff;
            font-weight: 500
        }

        .header-stats {
            display: flex;
            gap: 16px;
            margin-left: auto
        }

        .stat-badge {
            font-size: 11px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px
        }

        .stat-badge span {
            color: var(--text);
            font-weight: 500
        }

        .header-btn {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border2);
            background: transparent;
            color: var(--muted);
            font-size: 12px;
            cursor: pointer;
            font-family: var(--font-ui);
            transition: all .15s
        }

        .header-btn:hover {
            background: var(--bg4);
            color: var(--text);
            border-color: var(--border2)
        }

        .header-btn.active {
            background: var(--purple);
            border-color: var(--purple);
            color: #fff
        }

        /* Layout */
        .layout {
            display: grid;
            grid-template-columns: 280px 1fr 380px;
            height: calc(100vh - 52px)
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg2);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        .sidebar-section {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border)
        }

        .sidebar-title {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--muted);
            margin-bottom: 10px
        }

        .lang-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px
        }

        .lang-btn {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-size: 11px;
            cursor: pointer;
            font-family: var(--font-ui);
            transition: all .15s;
            text-align: center
        }

        .lang-btn:hover,
        .lang-btn.active {
            background: var(--bg4);
            color: var(--text);
            border-color: var(--border2)
        }

        .lang-btn.active {
            border-color: var(--purple);
            color: var(--purple2)
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background .15s;
            margin-bottom: 4px
        }

        .history-item:hover {
            background: var(--bg3)
        }

        .history-item.active {
            background: var(--bg4);
            border-left: 2px solid var(--purple)
        }

        .history-title {
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .history-meta {
            font-size: 10px;
            color: var(--muted);
            display: flex;
            gap: 8px
        }

        .history-bugs {
            color: var(--red)
        }

        .history-fixed {
            color: var(--green)
        }

        .empty-history {
            padding: 20px;
            text-align: center;
            color: var(--muted);
            font-size: 12px
        }

        /* Editor panel */
        .editor-panel {
            display: flex;
            flex-direction: column;
            background: var(--bg)
        }

        .editor-header {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg2)
        }

        .editor-title {
            font-size: 12px;
            font-weight: 500;
            flex: 1
        }

        .editor-lang {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--bg4);
            color: var(--purple2)
        }

        .editor-wrap {
            flex: 1;
            position: relative;
            overflow: hidden
        }

        .code-input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: var(--font-code);
            font-size: 13px;
            line-height: 1.7;
            padding: 16px;
            resize: none;
            tab-size: 2;
            position: relative;
            z-index: 2
        }

        .line-numbers {
            position: absolute;
            left: 0;
            top: 0;
            padding: 16px 8px;
            font-family: var(--font-code);
            font-size: 13px;
            line-height: 1.7;
            color: var(--muted);
            text-align: right;
            user-select: none;
            pointer-events: none;
            min-width: 40px;
            z-index: 1
        }

        .editor-footer {
            padding: 10px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg2)
        }

        .btn {
            padding: 8px 18px;
            border-radius: 7px;
            border: none;
            font-family: var(--font-ui);
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            transition: all .15s;
            display: flex;
            align-items: center;
            gap: 7px
        }

        .btn-primary {
            background: var(--green);
            color: #000
        }

        .btn-primary:hover {
            background: #00e67a;
            transform: translateY(-1px)
        }

        .btn-primary:active {
            transform: translateY(0)
        }

        .btn-secondary {
            background: var(--bg4);
            color: var(--text);
            border: 1px solid var(--border2)
        }

        .btn-secondary:hover {
            background: var(--bg3);
            border-color: var(--border2)
        }

        .btn-purple {
            background: var(--purple);
            color: #fff
        }

        .btn-purple:hover {
            background: #6d28d9
        }

        .btn:disabled {
            opacity: .4;
            cursor: not-allowed;
            transform: none
        }

        .char-count {
            font-size: 11px;
            color: var(--muted);
            margin-left: auto
        }

        /* Results panel */
        .results-panel {
            background: var(--bg2);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        .results-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px
        }

        .results-title {
            font-size: 12px;
            font-weight: 500;
            flex: 1
        }

        .status-pill {
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 500
        }

        .status-ready {
            background: #ffffff10;
            color: var(--muted)
        }

        .status-analyzing {
            background: #f59e0b20;
            color: var(--yellow);
            animation: pulse-text 1s ease infinite
        }

        .status-done {
            background: #00ff8820;
            color: var(--green)
        }

        .status-error {
            background: #ef444420;
            color: var(--red)
        }

        @keyframes pulse-text {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .5
            }
        }

        .results-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px
        }

        .thinking-box {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--muted);
            font-family: var(--font-code)
        }

        .thinking-label {
            font-size: 10px;
            color: var(--purple2);
            font-weight: 600;
            margin-bottom: 8px;
            font-family: var(--font-ui)
        }

        .bug-card {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            animation: slide-in .3s ease
        }

        @keyframes slide-in {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .bug-card.critical {
            border-left: 3px solid var(--red)
        }

        .bug-card.high {
            border-left: 3px solid var(--red)
        }

        .bug-card.medium {
            border-left: 3px solid var(--yellow)
        }

        .bug-card.low {
            border-left: 3px solid var(--blue)
        }

        .bug-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px
        }

        .bug-num {
            font-size: 10px;
            font-weight: 700;
            color: var(--muted)
        }

        .bug-type {
            font-size: 12px;
            font-weight: 600;
            flex: 1
        }

        .severity-badge {
            font-size: 9px;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase
        }

        .sev-critical,
        .sev-high {
            background: #ef444420;
            color: var(--red)
        }

        .sev-medium {
            background: #f59e0b20;
            color: var(--yellow)
        }

        .sev-low {
            background: #3b82f620;
            color: var(--blue)
        }

        .bug-line {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 6px
        }

        .bug-desc {
            font-size: 12px;
            color: var(--text);
            line-height: 1.6;
            margin-bottom: 10px
        }

        .solutions-title {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--muted);
            margin-bottom: 8px
        }

        .solution {
            background: var(--bg4);
            border-radius: 7px;
            padding: 10px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: border .15s;
            border: 1px solid transparent
        }

        .solution:hover {
            border-color: var(--purple)
        }

        .solution-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px
        }

        .solution-num {
            font-size: 10px;
            color: var(--purple2);
            font-weight: 600
        }

        .solution-approach {
            font-size: 12px;
            font-weight: 500;
            flex: 1
        }

        .solution-code {
            font-family: var(--font-code);
            font-size: 11px;
            background: var(--bg);
            padding: 8px 10px;
            border-radius: 5px;
            color: var(--green);
            margin-bottom: 6px;
            word-break: break-all
        }

        .solution-exp {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.5
        }

        .copy-btn {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--border2);
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            float: right;
            font-family: var(--font-ui)
        }

        .copy-btn:hover {
            background: var(--bg4);
            color: var(--text)
        }

        .roadmap-card {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            animation: slide-in .3s ease
        }

        .roadmap-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--green);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .health-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600
        }

        .health-good,
        .health-excellent {
            background: #00ff8820;
            color: var(--green)
        }

        .health-fair {
            background: #f59e0b20;
            color: var(--yellow)
        }

        .health-poor {
            background: #ef444420;
            color: var(--red)
        }

        .roadmap-step {
            font-size: 12px;
            color: var(--muted);
            padding: 4px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 8px
        }

        .roadmap-step:last-child {
            border-bottom: none
        }

        .step-icon {
            color: var(--green);
            flex-shrink: 0
        }

        .diff-view {
            margin-top: 8px
        }

        .diff-title {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--muted);
            margin-bottom: 6px
        }

        .diff-line {
            font-family: var(--font-code);
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 2px
        }

        .diff-old {
            background: #ef444410;
            color: #ef9999;
            text-decoration: line-through
        }

        .diff-new {
            background: #00ff8810;
            color: var(--green)
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted)
        }

        .empty-icon {
            font-size: 32px;
            margin-bottom: 12px;
            opacity: .3
        }

        .empty-text {
            font-size: 13px;
            margin-bottom: 6px
        }

        .empty-sub {
            font-size: 11px;
            opacity: .6
        }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px
        }

        .stat-card {
            background: var(--bg3);
            border-radius: 8px;
            padding: 10px;
            text-align: center
        }

        .stat-val {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 2px
        }

        .stat-lbl {
            font-size: 10px;
            color: var(--muted)
        }

        .progress-bar {
            height: 3px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px
        }

        .progress-fill {
            height: 100%;
            background: var(--green);
            border-radius: 2px;
            transition: width .5s ease
        }

        ::-webkit-scrollbar {
            width: 4px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border2);
            border-radius: 2px
        }

        .streaming-cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background: var(--green);
            animation: blink .7s ease infinite;
            vertical-align: middle;
            margin-left: 2px;
            border-radius: 1px
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="logo">
            <div class="logo-dot"></div>
            <span class="logo-text">AI SWE Bot</span>
            <span class="logo-version">V3.0</span>
        </div>
        <div class="header-stats">
            <div class="stat-badge">Sessions <span id="hdr-sessions">0</span></div>
            <div class="stat-badge">Bugs fixed <span id="hdr-fixed">0</span></div>
            <div class="stat-badge">Fix rate <span id="hdr-rate">0%</span></div>
        </div>
        <button class="header-btn" onclick="openDashboard()">Dashboard</button>
        <button class="header-btn" onclick="clearAll()">Clear</button>
    </div>

    <div class="layout">

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Language</div>
                <div class="lang-grid">
                    <button class="lang-btn active" onclick="setLang('python',this)">Python</button>
                    <button class="lang-btn" onclick="setLang('javascript',this)">JavaScript</button>
                    <button class="lang-btn" onclick="setLang('java',this)">Java</button>
                    <button class="lang-btn" onclick="setLang('cpp',this)">C++</button>
                    <button class="lang-btn" onclick="setLang('go',this)">Go</button>
                    <button class="lang-btn" onclick="setLang('rust',this)">Rust</button>
                </div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-title">Session history</div>
            </div>
            <div class="history-list" id="history-list">
                <div class="empty-history">No sessions yet</div>
            </div>
        </div>

        <!-- Editor -->
        <div class="editor-panel">
            <div class="editor-header">
                <span class="editor-title">Code editor</span>
                <span class="editor-lang" id="lang-display">Python</span>
            </div>
            <div class="editor-wrap">
                <div class="line-numbers" id="line-numbers">1</div>
                <textarea id="code" class="code-input" placeholder="Paste your buggy code here...

# Example:
def calculate_average(numbers):
    total = 0
    for num in numbers:
        total += num
    average = total / len(numbers)
    return averge

result = calculate_average([10, 20, 30])
print('Average is: ' + result)" spellcheck="false" oninput="updateLineNumbers();updateCharCount()"
                    onkeydown="handleTab(event)"></textarea>
            </div>
            <div class="editor-footer">
                <button class="btn btn-primary" id="analyze-btn" onclick="analyze()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.35-4.35" />
                    </svg>
                    Analyze bugs
                </button>
                <button class="btn btn-purple" id="fix-btn" onclick="fixCode()" disabled>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" />
                        <path d="m9 12 2 2 4-4" />
                    </svg>
                    Auto fix all
                </button>
                <button class="btn btn-secondary" onclick="loadSample()">Load sample</button>
                <span class="char-count" id="char-count">0 chars</span>
            </div>
        </div>

        <!-- Results -->
        <div class="results-panel">
            <div class="results-header">
                <span class="results-title">Analysis results</span>
                <span class="status-pill status-ready" id="status-pill">Ready</span>
            </div>
            <div class="results-body" id="results">
                <div class="empty-state">
                    <div class="empty-icon">&#9881;</div>
                    <div class="empty-text">Paste code and click Analyze</div>
                    <div class="empty-sub">Supports Python, JS, Java, C++, Go, Rust</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentBugs = [];
        let currentSolutions = [];
        let currentLanguage = 'python';
        let sessionHistory = [];
        let totalSessions = 0;
        let totalFixed = 0;
        let totalBugs = 0;

        function setLang(lang, btn) {
            currentLanguage = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('lang-display').textContent = lang.charAt(0).toUpperCase() + lang.slice(1);
        }

        function updateLineNumbers() {
            const code = document.getElementById('code').value;
            const lines = code.split('\n').length;
            const nums = Array.from({ length: lines }, (_, i) => i + 1).join('\n');
            document.getElementById('line-numbers').textContent = nums;
        }

        function updateCharCount() {
            const len = document.getElementById('code').value.length;
            document.getElementById('char-count').textContent = len.toLocaleString() + ' chars';
        }

        function handleTab(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const ta = e.target;
                const start = ta.selectionStart;
                ta.value = ta.value.substring(0, start) + '  ' + ta.value.substring(ta.selectionEnd);
                ta.selectionStart = ta.selectionEnd = start + 2;
                updateLineNumbers();
            }
        }

        function setStatus(text, type) {
            const pill = document.getElementById('status-pill');
            pill.textContent = text;
            pill.className = 'status-pill status-' + type;
        }

        function loadSample() {
            const samples = {
                python: `def calculate_average(numbers):
    total = 0
    for num in numbers:
        total += num
    average = total / len(numbers)
    return averge

result = calculate_average([10, 20, 30])
print("Average is: " + result)`,
                javascript: `function calculateTotal(items) {
    let total = 0
    for (let i = 0; i <= items.length; i++) {
        total += items[i].price
    }
    return total
}
console.log(calculateTotal([{price: 10}, {price: 20}]))`,
                java: `public class Calculator {
    public static int divide(int a, int b) {

        function openDashboard() {

        async function analyze() {
            const code = document.getElementById('code').value.trim();
            if (!code) return;

            setStatus('Analyzing...', 'analyzing');
            document.getElementById('analyze-btn').disabled = true;
            document.getElementById('fix-btn').disabled = true;

            document.getElementById('results').innerHTML = `
    <div class="thinking-box">
      <div class="thinking-label">AI THINKING</div>
      Detecting language... analyzing code structure... identifying weak points...<span class="streaming-cursor"></span>
    </div>`;

            try {
                const res = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, language: currentLanguage })
                });
                const data = await res.json();
                currentBugs = data.bugs || [];
                currentSolutions = data.solutions || [];

                totalBugs += currentBugs.length;
                totalSessions++;
                document.getElementById('hdr-sessions').textContent = totalSessions;

                let html = '';

                if (currentBugs.length === 0) {
                    html = `<div class="empty-state">
        <div style="font-size:32px;margin-bottom:12px">&#10003;</div>
        <div class="empty-text" style="color:var(--green)">No bugs detected</div>
        <div class="empty-sub">Your code looks clean</div>
      </div>`;
                    setStatus('Clean', 'done');
                } else {
                    html += `<div class="stats-row">
        <div class="stat-card"><div class="stat-val" style="color:var(--red)">${currentBugs.length}</div><div class="stat-lbl">Bugs found</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--purple2)">${data.language ? data.language.toUpperCase() : currentLanguage.toUpperCase()}</div><div class="stat-lbl">Language</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--yellow)">${currentBugs.filter(b => b.severity === 'high' || b.severity === 'critical').length}</div><div class="stat-lbl">High severity</div></div>
      </div>`;

                    currentBugs.forEach((bug, i) => {
                        const solutions = (currentSolutions[i] || {}).solutions || [];
                        html += `<div class="bug-card ${bug.severity || 'medium'}">
          <div class="bug-header">
            <span class="bug-num">BUG #${bug.bug_id || i + 1}</span>
            <span class="bug-type">${bug.type || 'Error'}</span>
            <span class="severity-badge sev-${bug.severity || 'medium'}">${bug.severity || 'medium'}</span>
          </div>
          <div class="bug-line">Line ${bug.line || '?'}</div>
          <div class="bug-desc">${bug.description || ''}</div>`;

                        if (solutions.length > 0) {
                            html += `<div class="solutions-title">Solutions</div>`;
                            solutions.forEach(s => {
                                html += `<div class="solution">
              <div class="solution-header">
                <span class="solution-num">Solution ${s.solution_id}</span>
                <span class="solution-approach">${s.approach || ''}</span>
                <button class="copy-btn" onclick="copyFix('${(s.fixed_code || '').replace(/'/g, "\\'")}')">Copy</button>
              </div>
              <div class="solution-code">${escapeHtml(s.fixed_code || '')}</div>
              <div class="solution-exp">${s.explanation || ''}</div>
            </div>`;
                            });
                        }
                        html += `</div>`;
                    });

                    setStatus(`Found ${currentBugs.length} bugs`, 'error');
                    document.getElementById('fix-btn').disabled = false;
                }

                document.getElementById('results').innerHTML = html;
                addToHistory(code, currentBugs.length, 0);

            } catch (e) {
                setStatus('Error', 'error');
                document.getElementById('results').innerHTML = `<div class="empty-state"><div class="empty-text" style="color:var(--red)">Analysis failed</div><div class="empty-sub">${e.message}</div></div>`;
            }
            document.getElementById('analyze-btn').disabled = false;
        }

        async function fixCode() {
            const code = document.getElementById('code').value.trim();
            setStatus('Fixing...', 'analyzing');
            document.getElementById('fix-btn').disabled = true;

            try {
                const res = await fetch('/fix', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, bugs: currentBugs, solutions: currentSolutions, language: currentLanguage })
                });
                const data = await res.json();

                document.getElementById('code').value = data.fixed_code || code;
                updateLineNumbers();

                totalFixed += (data.fixes_applied || []).length;
                document.getElementById('hdr-fixed').textContent = totalFixed;
                const rate = totalBugs > 0 ? Math.round(totalFixed / totalBugs * 100) : 0;
                document.getElementById('hdr-rate').textContent = rate + '%';

                const roadmap = data.roadmap || {};
                let html = `<div class="roadmap-card">
      <div class="roadmap-title">
        Fix complete
        <span class="health-badge health-${roadmap.code_health || 'good'}">${(roadmap.code_health || 'good').toUpperCase()}</span>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px">${roadmap.summary || 'Code fixed successfully'}</div>`;

                if (roadmap.steps_taken) {
                    roadmap.steps_taken.forEach(step => {
                        html += `<div class="roadmap-step"><span class="step-icon">&#10003;</span>${step}</div>`;
                    });
                }

                const fixes = data.fixes_applied || [];
                if (fixes.length > 0) {
                    html += `<div class="diff-view"><div class="diff-title">Changes made</div>`;
                    fixes.forEach(f => {
                        html += `<div class="diff-line diff-new">&#10003; Bug #${f.bug_id} fixed — ${f.solution || ''}</div>`;
                    });
                    html += `</div>`;
                }

                html += `</div>`;

                const progressPct = Math.round((fixes.length / currentBugs.length) * 100);
                html += `<div style="font-size:11px;color:var(--muted);margin-bottom:6px">Fixed ${fixes.length} of ${currentBugs.length} bugs</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>`;

                document.getElementById('results').innerHTML = html;
                setStatus('Fixed!', 'done');
                addToHistory(code, currentBugs.length, fixes.length);

            } catch (e) {
                setStatus('Error', 'error');
            }
        }

        function copyFix(code) {
            navigator.clipboard.writeText(code).then(() => {
                const btns = document.querySelectorAll('.copy-btn');
                btns.forEach(b => { if (b.onclick && b.onclick.toString().includes(code.substring(0, 10))) { b.textContent = 'Copied!'; setTimeout(() => b.textContent = 'Copy', 1500); } });
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function addToHistory(code, bugs, fixed) {
            const first_line = code.split('\n')[0].substring(0, 40);
            sessionHistory.unshift({ title: first_line || 'Code session', bugs, fixed, time: new Date().toLocaleTimeString() });
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            if (sessionHistory.length === 0) {
                list.innerHTML = '<div class="empty-history">No sessions yet</div>';
                return;
            }
            list.innerHTML = sessionHistory.slice(0, 20).map((s, i) => `
    <div class="history-item ${i === 0 ? 'active' : ''}">
      <div class="history-title">${s.title}</div>
      <div class="history-meta">
        <span>${s.time}</span>
        <span class="history-bugs">${s.bugs} bugs</span>
        <span class="history-fixed">${s.fixed} fixed</span>
      </div>
    </div>
  `).join('');
        }

        function clearAll() {
            document.getElementById('code').value = '';
            document.getElementById('results').innerHTML = `<div class="empty-state"><div class="empty-icon">&#9881;</div><div class="empty-text">Paste code and click Analyze</div><div class="empty-sub">Supports Python, JS, Java, C++, Go, Rust</div></div>`;
            document.getElementById('fix-btn').disabled = true;
            setStatus('Ready', 'ready');
            currentBugs = [];
            currentSolutions = [];
            updateLineNumbers();
            updateCharCount();
        }

        updateLineNumbers();
    </script>
</body>

</html>
